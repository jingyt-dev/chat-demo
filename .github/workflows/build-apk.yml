name: build-apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Add Capacitor
        run: |
          pnpm add @capacitor/core @capacitor/android
          pnpm add -D @capacitor/cli

      - name: Init Capacitor
        run: pnpm exec cap init "DeepSleep" com.jing.deepsleep --web-dir dist

      - name: Add Android
        run: pnpm exec cap add android
        
      - name: Add assets tool
        run: pnpm add -D @capacitor/assets

      - name: Generate icons
        run: |
          pnpm exec capacitor-assets generate --android \
            --iconBackgroundColor '#ffffff' \
            --iconBackgroundColorDark '#1a1a1a' \
            --splashBackgroundColor '#ffffff'

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
